[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "python3 bot.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckEnabled = true
healthcheckTimeout = 300
healthcheckInterval = 60

[deploy.envVars]
PYTHON_VERSION = "3.11"
