[project]
name = "lux-roast-bot"
version = "0.1.0"
description = "A simple Discord bot for roasting Lux coin"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11.12",
    "anthropic>=0.45.2",
    "discord-py>=2.4.0",
    "emoji>=2.14.1",
    "openai>=1.61.1",
    "pillow>=11.1.0",
    "python-dotenv>=1.0.1",
    "pytz>=2025.1",
    "requests>=2.32.3",
    "base58>=2.1.1",
    "psycopg2-binary>=2.9.10",
    "backoff>=2.2.1",
]

[tool.railway]
build.builder = "nixpacks"
deploy.startCommand = "python bot.py"
deploy.restartPolicyType = "ON_FAILURE"
deploy.restartPolicyMaxRetries = 10

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"