[project]
name = "lux-roast-bot"
version = "0.1.0"
description = "A simple Discord bot for roasting Lux coin"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11.12",
    "discord-py>=2.4.0",
    "openai>=1.61.1",
    "pillow>=11.1.0",
    "python-dotenv>=1.0.1",
    "pytz>=2025.1",
    "requests>=2.32.3",
    "base58>=2.1.1",
    "psycopg2-binary>=2.9.10",
    "backoff>=2.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

# Railway deployment configuration
[build]
builder = "nixpacks"

[deploy]
startCommand = "python3 bot.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
